<!doctype html>
<!--
  ODiagramador render-kit.
  Carregado por todas as WebViews (macOS WKWebView, Windows WebView2, Linux WebKitGTK)
  e pelo renderizador headless (wry). Modos: ?mode=headless | ?mode=viewer
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ODiagramador</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div id="viewport">
  <div id="stage"></div>
</div>
<div id="palette" hidden></div>
<div id="ctor-form" hidden></div>
<div id="banner" hidden></div>
<div id="empty" hidden></div>
<div id="toolbar" hidden>
  <button data-act="zoom-out" title="-">&#8722;</button>
  <span id="zoom-label">100%</span>
  <button data-act="zoom-in" title="+">+</button>
  <button data-act="fit" id="fit-btn">Fit</button>
  <span id="layout-box" hidden>
    <select id="layout-select" title="Layout">
      <option value="auto">Auto (Mermaid)</option>
      <option value="elk">ELK</option>
      <option value="elk-interactive">ELK interactive</option>
      <option value="exact">Exact positions</option>
    </select>
    <button id="reset-positions" title="Reset positions">&#8634;</button>
  </span>
</div>
<!-- área de medição invisível usada no modo headless -->
<div id="measure" aria-hidden="true"></div>
<script src="vendor/mermaid-odg.min.js"></script>
<script src="bridge.js"></script>
<script src="palette.js"></script>
</body>
</html>
