<!doctype html>
<!--
  ODiagramador render-kit.
  Carregado por todas as WebViews (macOS WKWebView, Windows WebView2, Linux WebKitGTK)
  e pelo renderizador headless (wry). Modos: ?mode=headless | ?mode=viewer
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ODiagramador</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div id="viewport">
  <div id="stage"></div>
</div>
<!-- top bar: mode | undo, redo | creation (palette.js fills #pal-ctors) -->
<div id="palette" hidden>
  <div id="pal-fixed">
    <div class="seg" role="radiogroup">
    <button id="mode-edit" data-mode="edit" role="radio" aria-checked="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.3 1.7a1.6 1.6 0 0 1 2.3 0l.7.7a1.6 1.6 0 0 1 0 2.3L5.9 13.1l-3.4.9.9-3.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <span>Edit</span>
    </button>
    <button id="mode-view" data-mode="view" role="radio" aria-checked="false">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8s2.6-4.5 7-4.5S15 8 15 8s-2.6 4.5-7 4.5S1 8 1 8z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>
      <span>View</span>
    </button>
  </div>
    <span class="pal-sep"></span>
    <button id="undo-btn" data-act="undo" title="Undo" disabled>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5 2 7l3.5 3.5M2.5 7h7a4 4 0 0 1 0 8H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="redo-btn" data-act="redo" title="Redo" disabled>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3.5 14 7l-3.5 3.5M13.5 7h-7a4 4 0 0 0 0 8H9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  </div>
  <span class="pal-sep" id="pal-ctor-sep"></span>
  <div id="pal-ctors"></div>
</div>
<div id="marker-tip" hidden></div>
<div id="ctor-form" hidden></div>
<div id="banner" hidden></div>
<div id="empty" hidden></div>
<div id="toolbar" hidden>
  <button id="renderer-chip" hidden>
    <span id="renderer-label"></span>
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".8" fill="currentColor"/></svg>
  </button>
  <button data-act="zoom-out" title="-">&#8722;</button>
  <span id="zoom-label">100%</span>
  <button data-act="zoom-in" title="+">+</button>
  <button data-act="fit" id="fit-btn">Fit</button>
  <span id="layout-box" hidden>
    <select id="layout-select" title="Layout">
      <option value="auto">Auto (Mermaid)</option>
      <option value="elk">ELK</option>
      <option value="elk-interactive">ELK interactive</option>
      <option value="exact">Exact positions</option>
    </select>
    <button id="reset-positions" title="Reset positions">&#8634;</button>
  </span>
</div>
<!-- renderer help (renderers.js fills the dialog) -->
<div id="renderer-modal" hidden><div class="rm-dialog" role="dialog" aria-modal="true"></div></div>
<!-- área de medição invisível usada no modo headless -->
<div id="measure" aria-hidden="true"></div>
<script src="vendor/mermaid-odg.min.js"></script>
<script src="bridge.js"></script>
<script src="palette.js"></script>
<script src="renderers.js"></script>
</body>
</html>
