[workspace]
resolver = "2"
members = ["crates/odg-core", "crates/odg-render", "crates/odg-cli", "crates/odg-ffi"]
# apps/linux is built only on Linux (needs GTK4/WebKitGTK); see apps/linux/Cargo.toml
exclude = ["apps/linux"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
authors = ["ODiagramador contributors"]
repository = "https://github.com/AlexGracas/ODiagramador"

[workspace.dependencies]
odg-core = { path = "crates/odg-core" }
odg-render = { path = "crates/odg-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = { version = "0.9", features = ["macros"] }
regex = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tao = "0.37"
wry = "0.57"

[profile.release]
lto = "thin"
strip = true
