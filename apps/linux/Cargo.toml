[package]
name = "odiagramador-gtk"
description = "ODiagramador for Linux — GTK4 + libadwaita + WebKitGTK over odg-core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "odiagramador"
path = "src/main.rs"

[dependencies]
odg-core = { path = "../../crates/odg-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
webkit = { package = "webkit6", version = "0.6" }
sourceview = { package = "sourceview5", version = "0.11" }

[profile.release]
lto = "thin"
strip = true
