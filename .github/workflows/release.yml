name: release

# Push a tag like v0.1.0 to build the macOS and Windows apps and publish them as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal app (Apple Silicon + Intel)
        run: |
          VERSION="${TAG#v}" UNIVERSAL=1 ZIP=1 apps/macos/build-app.sh "$PWD/dist"
          lipo -archs dist/ODiagramador.app/Contents/MacOS/ODiagramador
      - name: Smoke test bundled odg (headless WebKit render)
        run: dist/ODiagramador.app/Contents/MacOS/odg check examples/diagrams/order-flow.mmd --no-save
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/ODiagramador-*-macos-universal.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Rust core and odg
        run: cargo build --release -p odg-ffi -p odg-cli
      - name: Smoke test odg (headless WebView2 render)
        shell: pwsh
        run: ./target/release/odg.exe check examples/diagrams/order-flow.mmd --no-save
      - name: Publish WPF app (self-contained, no .NET install needed)
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart("v")
          dotnet publish apps/windows/ODiagramador/ODiagramador.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$version -o dist/ODiagramador
          foreach ($f in "ODiagramador.exe", "odg_ffi.dll", "odg.exe", "LICENSE.txt", "render-kit/index.html", "render-kit/vendor/mermaid-odg.min.js", "icons/modelcontextprotocol.svg") {
            if (-not (Test-Path "dist/ODiagramador/$f")) { throw "missing $f in the published app" }
          }
      - name: Smoke test app start-up
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/ODiagramador/ODiagramador.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "ODiagramador.exe exited during start-up (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Zip
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart("v")
          Compress-Archive -Path dist/ODiagramador -DestinationPath "dist/ODiagramador-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ODiagramador-*-windows-x64.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "ODiagramador $TAG" --notes-file .github/release-notes.md
          fi
